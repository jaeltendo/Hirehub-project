<!DOCTYPE html>
<html>
<head>
    <title>HireHub Community</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>HireHub Community</h1>
        <p>Connecting job seekers with employers.</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#apply">Apply for Work</a>
        <a href="#about">About Us</a>
    </nav>

    <main>
        <section id="home">
            <h2>Welcome to HireHub</h2>
            <p>Helping people find work and employers find workers.</p>
        </section>

        <section id="apply">
            <h2>Apply for Work</h2>
            <form>
                <label>Full Name:</label>
                <input type="text" required>

                <label>Phone Number:</label>
                <input type="tel" required>

                <label>Type of Work:</label>
                <input type="text" required>

                <button type="submit">Apply</button>
            </form>
        </section>

        <section id="about">
            <h2>About Us</h2>
            <p>HireHub connects people in the community through work opportunities.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HireHub Community</p>
    </footer>

</body>
</html>
